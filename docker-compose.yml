version: '3.8'

services:
  # FastAPI AI/ML Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillgap_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-resumes}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_secret_key_skillgap_2026}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-default_refresh_secret_key_skillgap_2026}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - OMP_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - backend_uploads:/app/uploads

  # React 19 Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:8000
    container_name: skillgap_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
